<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>СытоПлан — план питания на неделю</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#22C55E;--gd:#16A34A;--gt:#15803D;--gl:#ECFDF3;--bg:#F5F6F8;--txt:#111827;--mut:#6B7280;--bd:#ECEEF2;--r:22px;--sh:0 6px 22px rgba(17,24,39,.07);--y:#F59E0B;--yl:#FFFBEB;--red:#EF4444;--redl:#FEF2F2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#E9ECF0;font-family:Manrope,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#fff;position:relative;box-shadow:0 0 50px rgba(0,0,0,.07);overflow-x:hidden}
.hdr{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 14px;gap:8px}
.hdr-title{font-weight:800;font-size:16px;letter-spacing:-.01em;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.hdr-right{min-width:42px;text-align:right;font-size:13px;color:var(--mut);font-weight:600;white-space:nowrap}
.linkbtn{border:0;background:none;color:var(--gt);font-weight:700;font-size:13px;padding:6px 0}
.prog{height:6px;background:#EEF0F3;margin:0 18px 8px;border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .45s ease}
.content{padding:10px 18px 140px}
.content.app{padding-bottom:190px}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.025em;margin:6px 0 8px}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:24px 0 12px}
.sub{color:var(--mut);font-size:15px;margin:0 0 20px;line-height:1.45}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.list{display:flex;flex-direction:column;gap:12px}
.opt{position:relative;background:#fff;border:3px solid #EEF0F3;border-radius:var(--r);box-shadow:var(--sh);padding:14px;text-align:left;transition:border-color .15s,background .15s,transform .1s;width:100%;font-size:15px}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--g);background:var(--gl)}
.ck{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--g);color:#fff;display:none;place-items:center}
.ck svg{width:14px;height:14px}
.opt.sel .ck{display:grid}
.opt .em{font-size:30px;line-height:1}
.opt .t{font-weight:800;margin-top:8px;font-size:15px;line-height:1.2}
.opt .s{color:var(--mut);font-size:13px;margin-top:3px;line-height:1.3}
.opt.row{display:flex;align-items:center;gap:14px;padding:16px 46px 16px 16px}
.opt.row .t{margin-top:0;font-size:17px}
.opt.row .em{font-size:34px;width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;flex:0 0 52px}
.opt.sel.row .em{background:#fff}
.store{text-align:center;padding:16px 6px 12px}
.badge{width:52px;height:52px;border-radius:16px;margin:0 auto;display:grid;place-items:center;font-weight:800;font-size:24px}
.store .t{font-size:13px;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store .s{font-size:12px}
.eq{text-align:center;padding:16px 6px 12px}
.eq .em{font-size:32px}
.eq .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;border:2px solid var(--bd);background:#fff;font-weight:700;font-size:14px;transition:all .15s}
.chip.sel{border-color:var(--g);background:var(--gl);color:var(--gt)}
.chip .x{font-size:16px;line-height:1}
.daychips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daychips .chip{justify-content:center;padding:14px 0;font-size:15px;border-radius:16px}
.bigtext{font-size:17px;font-weight:700;margin-top:18px;color:var(--gt)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:14px 18px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,#fff 72%,rgba(255,255,255,0));z-index:40}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:58px;border-radius:999px;border:0;background:var(--g);color:#fff;font-weight:800;font-size:17px;box-shadow:0 10px 22px rgba(34,197,94,.32);transition:transform .1s,background .2s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:0 0 20px}
.btn:disabled{background:#D1D5DB;box-shadow:none;cursor:default}
.btn.sec{background:var(--bg);color:var(--txt);box-shadow:none}
.btn.sm{height:48px;font-size:15px}
.btn.out{background:#fff;color:var(--gt);border:2px solid var(--g);box-shadow:none}
.stack{display:flex;flex-direction:column;gap:10px}
.sect{background:var(--bg);border-radius:var(--r);padding:16px}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid #F0F1F4;padding:16px}
.stepper-card{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid #F0F1F4;padding:16px}
.stepper-card .t{font-weight:800;font-size:17px}.stepper-card .s{color:var(--mut);font-size:13px;margin-top:2px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:42px;height:42px;border-radius:50%;border:0;background:var(--gl);color:var(--gt);font-size:22px;font-weight:800;display:grid;place-items:center}
.stepper button:disabled{background:var(--bg);color:#C2C7CF}
.stepper .v{min-width:28px;text-align:center;font-size:20px;font-weight:800}
.bignum{font-size:56px;font-weight:800;letter-spacing:-.03em;color:var(--gt);line-height:1}
.center{text-align:center}
.mut{color:var(--mut)}
.small{font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:16px;padding:0 14px;height:50px;margin-bottom:14px}
.search input{border:0;background:none;outline:none;font-size:16px;flex:1;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:0;background:var(--bg);font-weight:700;font-size:14px;color:var(--mut)}
.tab.on{background:var(--txt);color:#fff}
.tile{position:relative;background:#fff;border:3px solid #EEF0F3;border-radius:18px;padding:12px 4px 10px;text-align:center;font-size:12.5px;font-weight:700;line-height:1.2;box-shadow:var(--sh)}
.tile .em{font-size:28px;display:block;margin-bottom:6px}
.tile.sel{border-color:var(--g);background:var(--gl)}
.tile .ck{top:6px;right:6px;width:20px;height:20px}
.tile.sel .ck{display:grid}
.budget-box{text-align:center;padding:10px 0 4px}
.budget-input{display:inline-flex;align-items:baseline;gap:10px;border-bottom:3px dashed #D7F5E2;padding:0 6px 4px}
.budget-input span{font-size:40px;font-weight:800;color:var(--gt)}
.budget-input input{border:0;outline:none;background:none;font-size:56px;font-weight:800;letter-spacing:-.03em;width:6.2ch;text-align:left;color:var(--txt);padding:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;background:linear-gradient(to right,var(--g) var(--p,50%),#E5E7EB var(--p,50%));outline:none;margin:22px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--g);box-shadow:0 3px 10px rgba(0,0,0,.15)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--g)}
.range-l{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-weight:600}
.status{border-radius:var(--r);padding:16px;margin:20px 0 14px;display:flex;gap:12px;align-items:flex-start}
.status .ic{font-size:24px;line-height:1}
.status b{display:block;font-size:16px;margin-bottom:3px}
.status p{margin:0;font-size:14px;line-height:1.4;color:#374151}
.status.ok{background:var(--gl);border:2px solid #BBF7D0}.status.ok b{color:var(--gt)}
.status.tight{background:var(--yl);border:2px solid #FDE68A}.status.tight b{color:#B45309}
.status.bad{background:var(--redl);border:2px solid #FECACA}.status.bad b{color:#B91C1C}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.metric{background:var(--bg);border-radius:18px;padding:12px 8px;text-align:center}
.metric .v{font-size:17px;font-weight:800;white-space:nowrap}
.metric .l{font-size:12px;color:var(--mut);margin-top:2px}
/* loading */
.loading{display:flex;flex-direction:column;align-items:center;padding:40px 22px 40px;min-height:100vh}
.orbit{position:relative;width:220px;height:220px;margin:20px 0 26px}
.orbit .core{position:absolute;inset:60px;border-radius:50%;background:var(--gl);display:grid;place-items:center;font-size:52px;box-shadow:0 0 0 12px #F4FDF7}
.orbit .ring{position:absolute;inset:0;animation:spin 6s linear infinite}
.orbit .ring span{position:absolute;font-size:30px;left:50%;top:50%;margin:-18px 0 0 -18px;width:36px;height:36px;display:grid;place-items:center;background:#fff;border-radius:50%;box-shadow:var(--sh)}
.orbit .ring span i{font-style:normal;display:block;animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.checklist{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;margin-top:10px}
.cli{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;color:#9CA3AF;transition:color .3s}
.cli .dot{width:26px;height:26px;border-radius:50%;border:2px solid #E5E7EB;display:grid;place-items:center;flex:0 0 26px;transition:all .3s}
.cli.cur{color:var(--txt)}.cli.cur .dot{border-color:var(--g);border-top-color:transparent;animation:spin .8s linear infinite}
.cli.done{color:var(--txt)}.cli.done .dot{background:var(--g);border-color:var(--g);color:#fff}
.cli .dot svg{width:14px;height:14px;display:none}.cli.done .dot svg{display:block}
/* app */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid #EEF0F3;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:45}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:700;color:#9CA3AF}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--gt)}
.navaction{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:430px;bottom:calc(62px + env(safe-area-inset-bottom));padding:10px 18px 10px;background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0));z-index:44}
.shopcard{display:flex;align-items:center;gap:14px;background:var(--gl);border:2px solid #BBF7D0;border-radius:var(--r);padding:14px 16px;width:100%;text-align:left}
.shopcard .ic{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px;flex:0 0 48px}
.shopcard .t{font-weight:800;font-size:16px}.shopcard .s{font-size:13px;color:#374151;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.pill.ok{background:#DCFCE7;color:var(--gt)}.pill.bad{background:#FEE2E2;color:#B91C1C}.pill.grey{background:var(--bg);color:var(--mut)}.pill.y{background:#FEF3C7;color:#B45309}
.dayh{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin:26px 0 10px}
.dayh .n{font-size:19px;font-weight:800}
.kbju{font-size:12px;font-weight:700;color:var(--mut);text-align:right;line-height:1.5}
.kbju .k{color:var(--gt)}.kbju .p{color:#2563EB}.kbju .f{color:#D97706}.kbju .c{color:#7C3AED}
.meal{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid #F0F1F4;padding:10px 10px 10px 10px;margin-bottom:10px;cursor:pointer}
.thumb{width:72px;height:72px;flex:0 0 72px;border-radius:18px;display:grid;place-items:center;font-size:38px}
.mi{flex:1;min-width:0}
.mlabel{font-size:11px;font-weight:800;color:var(--gt);letter-spacing:.06em}
.mt{font-weight:800;font-size:15.5px;line-height:1.25;margin:2px 0 3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mm{font-size:12.5px;color:var(--mut);font-weight:600}
.lefttag{display:inline-block;font-size:11px;font-weight:700;background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:99px;margin-top:4px}
.swap{border:0;background:var(--bg);border-radius:16px;width:58px;padding:8px 0 7px;font-size:10.5px;font-weight:800;color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 58px}
.swap svg{width:16px;height:16px;color:var(--gt)}
.empty-meal{opacity:.6}
.foot{font-size:12px;color:var(--mut);margin-top:24px;line-height:1.45;text-align:center}
/* shopping */
.sumcard{background:var(--bg);border-radius:var(--r);padding:16px;margin-bottom:6px}
.sumrow{display:flex;justify-content:space-between;align-items:baseline}
.sumrow .v{font-size:26px;font-weight:800}
.bar{height:10px;border-radius:99px;background:#E5E7EB;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--g)}
.aisle{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-weight:800;font-size:16px}
.aisle .c{color:var(--mut);font-weight:700;font-size:13px}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #F1F2F4}
.cb{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:2px solid #D1D5DB;background:#fff;display:grid;place-items:center;color:#fff;padding:0}
.cb svg{width:15px;height:15px;opacity:0}
.li.done .cb{background:var(--g);border-color:var(--g)}.li.done .cb svg{opacity:1}
.li .e{font-size:24px;width:30px;text-align:center;flex:0 0 30px}
.li .nm{flex:1;min-width:0}
.li .nm b{display:block;font-size:15px;line-height:1.25}
.li .nm span{font-size:12.5px;color:var(--mut);font-weight:600}
.li .pr{font-weight:800;font-size:15px;white-space:nowrap}
.li.done .nm b,.li.done .pr{text-decoration:line-through;color:#9CA3AF}
.homepill{font-size:11px;font-weight:800;color:var(--gt);background:var(--gl);padding:4px 9px;border-radius:99px;white-space:nowrap}
/* recipe */
.hero{position:relative;height:250px;display:grid;place-items:center;font-size:110px}
.hero .icon-btn{position:absolute;top:calc(14px + env(safe-area-inset-top));background:rgba(255,255,255,.92);box-shadow:var(--sh)}
.rbody{position:relative;margin-top:-26px;background:#fff;border-radius:28px 28px 0 0;padding:22px 18px 140px}
.rmeta{color:var(--mut);font-size:14px;font-weight:600}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 6px}
.act{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--txt);white-space:nowrap;padding:0}
.act .c{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.act .c svg{width:22px;height:22px}
.act.on .c{background:var(--gl);color:var(--gt)}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kb div{border-radius:16px;padding:12px 4px;text-align:center}
.kb b{display:block;font-size:19px;font-weight:800}
.kb span{font-size:11.5px;font-weight:700}
.kb .k{background:#ECFDF3;color:var(--gt)}.kb .p{background:#EFF6FF;color:#1D4ED8}.kb .f{background:#FFFBEB;color:#B45309}.kb .c{background:#F5F3FF;color:#6D28D9}
.times{display:flex;gap:8px;margin-top:12px}
.times div{flex:1;background:var(--bg);border-radius:16px;padding:10px;text-align:center;font-size:12px;color:var(--mut);font-weight:600}
.times b{display:block;color:var(--txt);font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:999px;padding:4px;margin:22px 0 14px}
.seg button{border:0;background:none;border-radius:999px;padding:11px;font-weight:800;font-size:14px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ing{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F1F2F4}
.ing .e{font-size:22px;width:28px;text-align:center}
.ing .n{flex:1;font-weight:600;font-size:15px}
.ing .q{font-weight:800;font-size:15px;white-space:nowrap}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;padding:10px 0;font-size:15.5px;line-height:1.45}
.steps li:before{content:counter(s);flex:0 0 32px;height:32px;border-radius:50%;background:var(--g);color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rc{background:#fff;border-radius:20px;box-shadow:var(--sh);border:1px solid #F0F1F4;overflow:hidden;cursor:pointer}
.rc .th{height:96px;display:grid;place-items:center;font-size:48px;position:relative}
.rc .th .fav{position:absolute;top:6px;right:8px;font-size:16px}
.rc .b{padding:10px 12px 12px}
.rc .b b{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.rc .b span{display:block;font-size:12px;color:var(--mut);margin-top:4px;font-weight:600}
.prow{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #F1F2F4;font-size:14.5px}
.prow .k{color:var(--mut);font-weight:600;flex:0 0 auto}
.prow .v{font-weight:700;text-align:right}
/* modal & toast */
.mback{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal{background:#fff;width:100%;max-width:430px;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .25s ease}
.modal h3{margin:0 0 8px;font-size:21px;font-weight:800}
.modal p{color:#4B5563;margin:0 0 16px;line-height:1.45}
.modal input[type=text]{width:100%;height:52px;border-radius:16px;border:2px solid var(--bd);padding:0 14px;font-size:16px;outline:none;margin-bottom:14px}
.modal input[type=text]:focus{border-color:var(--g)}
.modal textarea{width:100%;height:200px;border-radius:14px;border:2px solid var(--bd);padding:10px;font-size:13px;font-family:inherit}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.5}}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:90;max-width:90%;text-align:center;animation:fade .2s}
.intro{padding:24px 22px 160px;text-align:center}
.intro .logo{width:84px;height:84px;border-radius:26px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:44px;margin:30px auto 18px;box-shadow:0 14px 30px rgba(34,197,94,.35)}

const NB = '\u00A0';

function half(n){ const w=Math.floor(n), f=n-w; if(f<0.25) return String(w||(n>0?'½':'0')).replace(/^0$/,'½'); if(f<0.75) return (w?w:'')+'½'; return String(w+1); }
function fmtAmount(q,unit){ // для списка «нужно»
  if(unit==='шт') return Math.max(1,Math.ceil(q-0.01))+NB+'шт';
  const big = unit==='г'?'кг':'л';
  if(q>=1000) return dec(q/1000)+NB+big;
  const r = q<20?Math.max(1,Math.round(q)):(q<100?Math.round(q/5)*5:Math.round(q/10)*10);
  return r+NB+unit;
}
function fmtPack(p,unit){ if(unit==='шт') return p+NB+'шт'; if(p>=1000) return dec(p/1000)+NB+(unit==='г'?'кг':'л'); return p+NB+unit; }
function fmtIngQty(k,q,unit){ // для рецепта
  if(k==='salt'||k==='spices') return 'по вкусу';

  if(unit==='шт'){ const h=Math.max(0.5,Math.round(q*2)/2); return half(h)+NB+'шт'; }
  return fmtAmount(q,unit);
}

function load(){ try{ const s=JSON.parse(localStorage.getItem(LS_KEY)); if(s&&s.A){ const f=fresh(); const o=Object.assign(f,s); o.A=Object.assign(fresh().A,s.A); return o; } }catch(e){} return null; }

function set(p){ Object.assign(S,p); save(); render(); }

/* ====== РАСЧЁТЫ ====== */
function portions(){ return S.A.adults + S.A.kids*0.5; }

function budgetStatus(b){

  if(r>=1) return {cls:'ok',ic:'✅',title:'Укладываемся',text:`Типичная корзина для вашей семьи в ${st.loc} — около ${rub(Math.round(t/100)*100)}. Запас ~${rub(Math.max(0,Math.round((b-t)/100)*100))} на непредвиденное.`};

}
function dislikedKeys(){ const s=new Set(); S.A.dislikes.forEach(id=>{ const d=DISLIKES.find(x=>x[0]===id); if(d) d[3].forEach(k=>s.add(k)); }); return s; }
function recipeIngs(r){ const dk=dislikedKeys(); return r.ing.filter(i=>!(ING[i.k].opt && dk.has(i.k))); }

const DIETCHK = {

  lean:r=>!r.meat&&!r.fish&&!r.al.includes('dairy')&&!r.al.includes('eggs'),
  pp:r=>r.tags.includes('light')||r.k<=(r.m.includes('s')?300:450),

  const al=a.allergies.filter(x=>x!=='none'); const bad=r.al.filter(x=>al.includes(x));
  if(bad.length) return 'аллерген: '+bad.map(b=>ALLERGENS.find(x=>x.id===b).name.toLowerCase()).join(', ');

function recipeScore(r,ctx,slotKey){

  const plan=S.plan; const need={}; const p=portions();
  const add=(r,f)=>recipeIngs(r).forEach(i=>{ need[i.k]=(need[i.k]||0)+i.q*f; });
  if(plan) plan.slots.forEach(s=>{ if(s.r && RMAP[s.r]){ const r=RMAP[s.r]; add(r,p/r.sv); } });
  (S.extras||[]).forEach(x=>{ const r=RMAP[x.r]; if(r) add(r,x.serv/r.sv); });
  const st=store(); const items=[], home=[]; let total=0;
  Object.keys(need).forEach(k=>{ const g=ING[k], q=need[k];
    if(S.A.pantry.includes(k)){ home.push({k,g,q}); return; }
    const packs=Math.max(1,Math.ceil(q/g.pack-0.08));
    const price=Math.round(packs*g.price*st.mult);
    total+=price; items.push({k,g,q,packs,price});
  });
  const order=AISLES.map(a=>a.id);
  const sorter=(x,y)=>order.indexOf(x.g.aisle)-order.indexOf(y.g.aisle)||x.g.name.localeCompare(y.g.name,'ru');
  items.sort(sorter); home.sort(sorter);
  return {items,home,total};
}
function shopTotalFor(slots){ const save=S.plan; S.plan=Object.assign({},save||{},{slots}); const t=shopping().total; S.plan=save; return t; }

/* ====== ПЛАНИРОВЩИК ======
   1) фильтр по приёму пищи, диете, аллергенам, нелюбимому, технике;
   2) жадный выбор по баллам (стиль, кухня, разнообразие, общие ингредиенты, цена порции относительно цели);
   3) «готовка впрок»: обед следующего дня = остатки ужина (если рецепт batch);
   4) подгонка под бюджет: пока корзина (целыми упаковками) дороже бюджета — меняем самое дорогое блюдо на более дешёвое подходящее. */
function generatePlan(seed){
  const a=S.A; const days=dayOrder(), meals=mealOrder(); const p=portions();
  const perPortion=a.budget/(Math.max(1,portionsPerWeek()));
  const baseSum=meals.reduce((s,m)=>s+MEALMAP[m].base,0)/meals.length;
  const target={}; MEALS.forEach(m=>target[m.id]=perPortion*MEALMAP[m.id].base/baseSum);
  S.plan={seed:seed||String(Date.now()),slots:[]};
  const ctx={uses:{},ings:new Set(),target};
  const cands={}; meals.forEach(m=>cands[m]=candidates(m));
  const batch=a.styles.includes('batch')&&meals.includes('l')&&meals.includes('d');
  let prevDinner=-1;
  days.forEach((d,di)=>{
    ctx.dayRecipes=new Set();
    meals.forEach(m=>{
      const slots=S.plan.slots;
      if(m==='l' && batch && prevDinner>=0){ const src=slots[prevDinner]; const r=src.r&&RMAP[src.r];
        if(r && r.tags.includes('batch') && r.m.includes('l') && !slots.some(x=>x.src===prevDinner)){
          slots.push({d,m,r:src.r,src:prevDinner,left:true}); ctx.dayRecipes.add(src.r); return; } }
      const list=cands[m]; if(!list.length){ slots.push({d,m,r:null}); return; }
      ctx.m=m; let best=null,bs=-1e9;
      list.forEach(r=>{ const sc=recipeScore(r,ctx,d+m); if(sc>bs){bs=sc;best=r;} });
      slots.push({d,m,r:best.id}); ctx.uses[best.id]=(ctx.uses[best.id]||0)+1; ctx.dayRecipes.add(best.id);
      recipeIngs(best).forEach(i=>ctx.ings.add(i.k));
      if(m==='d') prevDinner=slots.length-1;
    });
  });
  fitBudget(cands);
  save();
}
function fitBudget(cands){
  const slots=S.plan.slots; const maxUse=S.A.styles.includes('batch')?3:2;
  const uses=()=>{const u={}; slots.forEach(s=>{ if(s.r&&!s.left) u[s.r]=(u[s.r]||0)+1; }); return u;};
  let total=shopping().total, guard=0;
  while(total>S.A.budget && guard++<150){
    const u=uses(); let best=null;
    slots.forEach((s,i)=>{ if(!s.r||s.left) return; const cur=portionCost(RMAP[s.r]);
      const same=new Set(slots.filter(x=>x.d===s.d).map(x=>x.r));
      const alts=(cands[s.m]||candidates(s.m)).filter(r=>r.id!==s.r && !same.has(r.id) && (u[r.id]||0)<maxUse && portionCost(r)<cur*0.9)
        .sort((x,y)=>portionCost(x)-portionCost(y)).slice(0,3).sort((x,y)=>(u[x.id]||0)-(u[y.id]||0));
      if(!alts.length) return; const sav=cur-portionCost(alts[0]);
      if(!best||sav>best.sav) best={i,r:alts[0].id,sav}; });
    if(!best) break;
    replaceSlot(best.i,best.r);
    total=shopping().total;
  }
}
function replaceSlot(i,rid){ const slots=S.plan.slots; slots[i].r=rid; slots[i].left=false; delete slots[i].src;
  slots.forEach(x=>{ if(x.src===i) x.r=rid; }); }
function swapMeal(i){
  const s=S.plan.slots[i]; if(!s) return;
  const ctx={uses:{},ings:new Set(),m:s.m}; S.plan.slots.forEach(x=>{ if(x.r) ctx.uses[x.r]=(ctx.uses[x.r]||0)+1; });
  ctx.dayRecipes=new Set(S.plan.slots.filter(x=>x.d===s.d&&x!==s).map(x=>x.r));
  const alts=candidates(s.m).filter(r=>r.id!==s.r).map(r=>({r,sc:recipeScore(r,ctx,'swap'+s.d+s.m)})).sort((a,b)=>b.sc-a.sc);
  if(!alts.length){ toast('Других подходящих рецептов нет'); return; }
  s.sw=(s.sw||0)+1; const pick=alts[(s.sw-1)%Math.min(alts.length,8)].r;
  replaceSlot(i,pick.id); save(); render(); toast('Заменили на «'+pick.t+'»');
}
function dayTotals(d){ const t={k:0,p:0,f:0,c:0}; S.plan.slots.filter(s=>s.d===d&&s.r).forEach(s=>{const r=RMAP[s.r]; t.k+=r.k;t.p+=r.p;t.f+=r.f;t.c+=r.cb;}); return t; }

function copyText(text){
  const ok=()=>toast('Скопировано в буфер обмена');
  const fallback=()=>{ try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const r=document.execCommand('copy'); ta.remove(); if(r){ok();return;} }catch(e){}
    modal(`<h3>Скопируйте вручную</h3><textarea readonly>${esc(text)}</textarea><div style="height:12px"></div><button class="btn sec" data-act="closemodal">Закрыть</button>`); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(ok,fallback); } else fallback();
}
function shareText(title,text){
  if(navigator.share){ navigator.share({title,text}).catch(err=>{ if(err&&err.name!=='AbortError') copyText(text); }); }
  else copyText(text);
}

function toggle(arr,id){ const i=arr.indexOf(id); if(i>=0) arr.splice(i,1); else arr.push(id); }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id, a=S.A;
  switch(act){
  case 'go': go(el.dataset.to); break;
  case 'continue': go(STEPS.includes(S.screen)?S.screen:'q1'); break;
  case 'goapp': set({screen:'app'}); break;
  case 'prev': { const i=STEPS.indexOf(S.screen); if(S.editing && S.plan && S.screen===S.editing){ S.editing=false; set({screen:'app'}); } else go(i>0?STEPS[i-1]:'intro'); break; }
  case 'next': { const i=STEPS.indexOf(S.screen); go(STEPS[i+1]); break; }
  case 'restart': modal(`<h3>Начать заново?</h3><p>Ответы, план и список покупок будут удалены.</p><div class="stack"><button class="btn" data-act="dorestart" style="background:#EF4444;box-shadow:none">Да, начать заново</button><button class="btn sec" data-act="closemodal">Отмена</button></div>`); break;
  case 'dorestart': closeModal(); try{localStorage.removeItem(LS_KEY);}catch(_){} S=fresh(); save(); render(); break;
  case 'closemodal': closeModal(); break;
  case 'city': cityModal(); break;
  case 'savecity': { const v=(document.getElementById('cityin').value||'').trim(); closeModal(); if(v) set({city:v}); break; }
  case 'store': a.store=id; save(); render(); break;
  case 'cnt': { const d=+el.dataset.d; a[id]=Math.max(id==='adults'?1:0,Math.min(10,a[id]+d)); a.budget=null; save(); render(); break; }
  case 'meal': toggle(a.meals,id); a.budget=null; save(); render(); break;
  case 'day': toggle(a.days,+id); a.budget=null; save(); render(); break;
  case 'equip': toggle(a.equip,id); save(); render(); break;
  case 'diet': if(id==='none') a.diets=['none']; else { a.diets=a.diets.filter(x=>x!=='none'); toggle(a.diets,id); if(!a.diets.length) a.diets=['none']; } save(); render(); break;
  case 'cuis': toggle(a.cuisines,id); save(); render(); break;
  case 'style': toggle(a.styles,id); save(); render(); break;
  case 'allergy': if(id==='none') a.allergies=['none']; else { a.allergies=a.allergies.filter(x=>x!=='none'); toggle(a.allergies,id); if(!a.allergies.length) a.allergies=['none']; } save(); render(); break;
  case 'dislike': toggle(a.dislikes,id); save(); render(); reapplySearch(); break;
  case 'pantry': toggle(a.pantry,id); save(); render(); reapplySearch(); break;
  case 'ptab': S.ptab=id; save(); render(); reapplySearch(); break;
  case 'build': if(!(a.budget>0)) return; S.editing=false; set({screen:'loading',ticks:{}}); break;
  case 'tab': S.tab=id; set({recipe:null}); break;
  case 'swap': e.stopPropagation(); swapMeal(+el.dataset.i); break;
  case 'open': S.serv=Math.max(1,Math.ceil(portions())); S.rtab='ing'; set({recipe:id}); break;
  case 'closerecipe': set({recipe:null}); break;
  case 'rtab': set({rtab:id}); break;
  case 'serv': S.serv=Math.max(1,Math.min(12,S.serv+(+el.dataset.d))); save(); render(); break;
  case 'fav': toggle(S.favs,S.recipe); save(); render(); toast(S.favs.includes(S.recipe)?'Добавлено в избранное':'Убрано из избранного'); break;
  case 'toplan': toPlanModal(); break;
  case 'putplan': { replaceSlot(+el.dataset.i,S.recipe); closeModal(); save(); render(); toast('Добавлено в план'); break; }
  case 'toshop': S.extras.push({r:S.recipe,serv:S.serv}); save(); toast(`Ингредиенты на ${S.serv} порц. добавлены в покупки`); break;
  case 'rmextra': S.extras.splice(+el.dataset.i,1); save(); render(); break;
  case 'sharerecipe': { const r=RMAP[S.recipe]; const t=`${r.t}\n\nИнгредиенты (${S.serv} порц.):\n`+recipeIngs(r).map(i=>`• ${ING[i.k].name} — ${fmtIngQty(i.k,i.q*S.serv/r.sv,ING[i.k].unit)}`).join('\n')+`\n\nПриготовление:\n`+r.steps.map((s,i)=>`${i+1}. ${s}`).join('\n')+`\n\n— ${APP_NAME}`;
    shareText(r.t,t.replace(/\u00A0/g,' ')); break; }
  case 'rfilter': set({rfilter:id}); break;
  case 'tick': S.ticks[id]=!S.ticks[id]; save(); render(); break;
  case 'cart': modal(`<div style="font-size:44px">🛒</div><h3>Интеграция с магазином скоро</h3><p>Скоро можно будет собрать корзину в ${store().loc} в один клик. Пока можно скопировать список или поделиться им.</p>

  case 'copylist': closeModal(); copyText(listText()); break;

  }

  const opts=S.plan.slots.map((s,i)=>({s,i})).filter(o=>r.m.includes(o.s.m));
  modal(`<h3>Добавить в план</h3><p>Выберите, какое блюдо заменить на «${esc(r.t)}».</p>
  ${opts.length?`<div class="stack">${opts.map(o=>{const cur=o.s.r?RMAP[o.s.r].t:'пусто'; return `<button class="btn sec sm" style="justify-content:flex-start;padding:0 18px;font-size:14px" data-act="putplan" data-i="${o.i}">${DAYS[o.s.d]} · ${MEALMAP[o.s.m].name}: <span class="mut" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(cur)}</span></button>`;}).join('')}</div>`
  :`<div class="warn">В плане нет подходящих приёмов пищи (${r.m.map(m=>MEALMAP[m].name.toLowerCase()).join(', ')}).</div>`}
  <div style="height:10px"></div><button class="btn sec" data-act="closemodal">Отмена</button>`);
}
let searchQ='';
function reapplySearch(){ const inp=document.querySelector('[data-search]'); if(!inp) return; inp.value=searchQ; filterTiles(searchQ); }
function filterTiles(q){ q=q.trim().toLowerCase(); document.querySelectorAll('#flt [data-name]').forEach(b=>{ b.style.display=!q||b.dataset.name.includes(q)?'':'none'; }); }
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.search){ searchQ=t.value; filterTiles(searchQ); return; }
  if(t.id==='bin'){ const v=parseInt(t.value.replace(/\D/g,''),10)||0; S.A.budget=Math.min(999999,v); t.value=v?fmt(S.A.budget):''; const r=document.getElementById('brange'); const rg=budgetRange(); r.value=Math.min(rg.max,Math.max(rg.min,v)); save(); updateBudgetUI(); return; }
  if(t.id==='brange'){ S.A.budget=+t.value; const b=document.getElementById('bin'); if(b) b.value=fmt(S.A.budget); save(); updateBudgetUI(); return; }
});
document.addEventListener('focusin',e=>{ if(e.target.id==='bin') setTimeout(()=>{ try{e.target.select();}catch(_){} },0); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='cityin'){ const btn=document.querySelector('[data-act=savecity]'); if(btn) btn.click(); } if(e.key==='Escape') closeModal(); });
// переходы по экранам сбрасывают поиск
const _go=go; go=function(sc){ searchQ=''; _go(sc); };
document.title=APP_NAME+' — план питания на неделю';
if(S.screen==='loading') loadingRun=false;
render();

</script>
</body>
